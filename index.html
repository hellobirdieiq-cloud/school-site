<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #10141c; color: #e8ecf4;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  h2 { font-size: 1.1rem; margin: 1.6rem 0 .6rem; text-align: left;
       color: #9aa6c2; font-weight: 700; }
  .quizzes { display: flex; flex-wrap: wrap; gap: 10px; }
  a.quiz { display: inline-flex; align-items: center; min-height: 44px;
           padding: .6rem 1.6rem; border-radius: 999px; background: #4d9fdc;
           color: #0d1520; font-weight: 700; text-decoration: none; }
  a.quiz:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<main>
  <h1>School</h1>
  <div id="sections"></div>
</main>
<script>
// Add a quiz: one line here.
const SECTIONS = [
  { subject: "All Subjects", quizzes: [
      { label: "Study", href: "study" } ] },
];
document.getElementById("sections").innerHTML = SECTIONS.map(s => `
  <h2>${s.subject}</h2>
  <div class="quizzes">${s.quizzes.map(q =>
    `<a class="quiz" href="${q.href}">${q.label}</a>`).join("")}</div>`).join("");
</script>
</body>
</html>
