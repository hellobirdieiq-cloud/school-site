<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common and Proper Nouns Quiz</title>
<style>
  :root{
    --ink:#eef1f8; --paper:#0f1626; --line:#2c3852; --soft:#1a2338;
    --go:#4fd68a; --go-bg:#153826; --no:#ff7b72; --mark:#ffd23f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
    font-size:19px;line-height:1.5}
  main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:24px;margin:0 0 4px}
  .small{font-size:15px;color:#9aa6c2}
  button{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);
    border-radius:12px;padding:12px 20px;cursor:pointer;min-height:48px}
  .primary{background:var(--mark);color:#0f1626;border-color:var(--mark);font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    margin:10px 0 2px}
  .score{font-weight:800;font-size:20px;background:var(--soft);padding:4px 14px;
    border-radius:999px;white-space:nowrap}
  .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 18px}
  .bar div{height:100%;background:var(--mark);width:0;transition:width .25s}
  /* The sentence. Every word is a plain span: no bold, no color, no border.
     Big line-height + padding gives a >=44px tap target without visual hints. */
  .sentence{background:var(--soft);border-radius:14px;padding:18px 16px;
    font-size:22px;line-height:2.2;margin:0 0 14px;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .w{padding:12px 1px;text-decoration-thickness:2px;text-underline-offset:5px}
  .w[data-s="1"]{text-decoration:underline}
  .w[data-s="2"]{text-decoration:underline;text-decoration-style:double}
  .w.wrong[data-s="1"],.w.wrong[data-s="2"]{text-decoration-color:var(--no)}
  .w.missed{text-decoration:underline dotted var(--no)}
  /* post-Check feedback (defined after the data-s rules so they override the
     kid's own underline): correct style shown in red dotted */
  .w.missed1{text-decoration:underline dotted var(--no)}
  .w.missed2{text-decoration:underline dotted var(--no);
    border-bottom:2px dotted var(--no);padding-bottom:8px}
  .w.struckw{text-decoration:line-through solid var(--no)}
  .gradenote{font-size:16px;color:#9aa6c2;margin:0 0 10px;min-height:1em}
  .gradenote b{color:var(--no);font-weight:700}
  .legend{margin:0 0 14px}
  .legend span{margin-right:16px}
  .u1{text-decoration:underline;text-underline-offset:3px}
  .u2{text-decoration:underline;text-decoration-style:double;text-underline-offset:3px}
  .verdict{font-size:20px;font-weight:700;min-height:28px;margin:2px 0 10px}
  .verdict.ok{color:var(--go)} .verdict.bad{color:var(--no)}
  .hidden{display:none}
  .finalscore{font-size:56px;font-weight:800;margin:12px 0}
</style>
</head>
<body>
<main>
  <h1>Common and Proper Nouns</h1>
  <p class="small legend" style="text-align:left">
    Tap a word to underline it.<br>
    Common noun – <span class="u1">once</span><br>
    Proper noun – <span class="u2">twice</span></p>

  <div id="quiz">
    <div class="topbar">
      <span class="small" id="progressText"></span>
      <span class="score" id="score">0 / 0</span>
    </div>
    <div class="bar"><div id="progressBar"></div></div>
    <p class="sentence" id="sentence"></p>
    <div class="verdict" id="verdict"></div>
    <p class="gradenote" id="gradeNote"></p>
    <p class="row">
      <button class="primary" id="checkBtn">Check</button>
      <button class="hidden" id="nextBtn">Next sentence</button>
    </p>
  </div>

  <div id="final" class="hidden">
    <h1>All done!</h1>
    <div class="finalscore" id="finalScore"></div>
    <p id="finalNote"></p>
    <p class="row"><button id="restartBtn">Start over</button></p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const PKEY = "nounQuiz100";
let DATA = null, cur = 0, tokens = [], graded = false;

function loadP(){ try { return JSON.parse(localStorage.getItem(PKEY)) || {states:{}, results:{}}; }
                  catch(e){ return {states:{}, results:{}}; } }
function saveP(p){ localStorage.setItem(PKEY, JSON.stringify(p)); }
const norm = w => w.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, "");

function score(){
  const p = loadP();
  const rs = Object.values(p.results);
  return { attempted: rs.length, correct: rs.filter(r => r.correct).length };
}
function drawScore(){
  const s = score();
  $("score").textContent = `${s.correct} / ${s.attempted}`;
  $("progressBar").style.width = `${(s.attempted/DATA.sentences.length)*100}%`;
}

function renderSentence(){
  const s = DATA.sentences[cur];
  const p = loadP();
  graded = !!p.results[s.n];
  $("progressText").textContent = `Sentence ${s.n} of ${DATA.sentences.length}`;
  const saved = p.states[s.n] || [];
  const box = $("sentence"); box.innerHTML = "";
  tokens = [];
  s.text.split(/\s+/).forEach((word, k) => {
    if(k) box.appendChild(document.createTextNode(" "));
    const sp = document.createElement("span");
    sp.className = "w"; sp.textContent = word;
    sp.dataset.s = saved[k] || 0; sp.dataset.k = k;
    box.appendChild(sp);
    tokens.push(sp);
  });
  $("verdict").textContent = ""; $("verdict").className = "verdict";
  $("gradeNote").innerHTML = "";
  $("checkBtn").classList.toggle("hidden", graded);
  $("nextBtn").classList.toggle("hidden", !graded);
  $("nextBtn").textContent = cur + 1 < DATA.sentences.length ? "Next sentence" : "See my score";
  if(graded) applyGrade(p.results[s.n], true);
  drawScore();
}

function userRuns(){
  // adjacent words with the same underline state = one (compound) noun.
  // Punctuation after a word ends the run: "Ghost Canoe, Nathan MacAllister"
  // is two nouns even though all four words are double-underlined.
  const runs = [];
  let run = null;
  tokens.forEach((sp, k) => {
    const st = +sp.dataset.s;
    if(st && run && run.s === st && run.end === k - 1){ run.end = k; run.words.push(norm(sp.textContent)); }
    else if(st){ run = { s: st, start: k, end: k, words: [norm(sp.textContent)] }; runs.push(run); }
    else run = null;
    // comma/semicolon/etc. after a word ends the run — but NOT a period,
    // which mid-sentence is an abbreviation ("Mrs. Byrd", "Dr. Patel")
    if(run && /[,;:!?]$/.test(sp.textContent)) run = null;
  });
  return runs;
}

function findSpan(words, claimed){
  // leftmost unclaimed occurrence of a key noun's word sequence
  const tw = tokens.map(sp => norm(sp.textContent));
  for(let i = 0; i + words.length <= tw.length; i++){
    if(claimed.has(i)) continue;
    let ok = true;
    for(let j = 0; j < words.length; j++)
      if(tw[i+j] !== words[j] || claimed.has(i+j)){ ok = false; break; }
    if(ok) return i;
  }
  return -1;
}

function grade(){
  const s = DATA.sentences[cur];
  const runs = userRuns();
  const keyLeft = s.nouns.map(nn => ({ t: nn.t, w: nn.w, matched: false }));
  const claimed = new Set();
  function tryMatchAt(words, pos, type){
    // longest still-unmatched keyed noun of `type` starting at words[pos]
    let best = -1, bestLen = 0;
    keyLeft.forEach((kn, ki) => {
      if(kn.matched || kn.t !== type || kn.w.length <= bestLen) return;
      if(pos + kn.w.length > words.length) return;
      if(kn.w.every((w, j) => w === words[pos + j])){ best = ki; bestLen = kn.w.length; }
    });
    return best;
  }
  // Partial matching inside each run: every keyed noun found is credited;
  // extra words don't void the rest ("eight nights" underlined together ->
  // "eight" is struck as not-a-noun, "nights" still counts).
  const wrongType = [], notNoun = [];
  runs.forEach(r => {
    const want = r.s === 1 ? "C" : "P";
    const other = want === "C" ? "P" : "C";
    const left = [];
    let pos = 0;
    while(pos < r.words.length){
      const ki = tryMatchAt(r.words, pos, want);
      if(ki >= 0){
        keyLeft[ki].matched = true;
        for(let j = 0; j < keyLeft[ki].w.length; j++) claimed.add(r.start + pos + j);
        pos += keyLeft[ki].w.length;
      } else { left.push(pos); pos++; }
    }
    // wrong-type matches must fit inside consecutive leftover words
    const still = [];
    for(let li = 0; li < left.length; ){
      const p0 = left[li];
      const ki = tryMatchAt(r.words, p0, other);
      let fits = ki >= 0;
      if(fits){
        for(let j = 0; j < keyLeft[ki].w.length; j++)
          if(left[li + j] !== p0 + j){ fits = false; break; }
      }
      if(fits){
        const len = keyLeft[ki].w.length;
        keyLeft[ki].matched = true;
        const idxs = [];
        for(let j = 0; j < len; j++){ idxs.push(r.start + p0 + j); claimed.add(r.start + p0 + j); }
        wrongType.push({ i: idxs, t: keyLeft[ki].t });
        li += len;
      } else { still.push(p0); li++; }
    }
    // remaining words: not a noun, grouped contiguously
    let chunk = null;
    still.forEach(p1 => {
      const g = r.start + p1;
      if(chunk && chunk[chunk.length - 1] === g - 1) chunk.push(g);
      else { chunk = [g]; notNoun.push(chunk); }
    });
  });
  // pass 3: missed nouns — correct style in red dotted
  const missed = [];
  keyLeft.filter(kn => !kn.matched).forEach(kn => {
    const at = findSpan(kn.w, claimed);
    if(at >= 0){
      const idxs = [];
      for(let j = 0; j < kn.w.length; j++){ idxs.push(at + j); claimed.add(at + j); }
      missed.push({ i: idxs, t: kn.t });
    }
  });
  const result = { v: 2,
    correct: notNoun.length === 0 && wrongType.length === 0 && missed.length === 0,
    missed, wrongType, notNoun };
  const p = loadP();
  p.states[s.n] = tokens.map(sp => +sp.dataset.s);
  p.results[s.n] = result;
  saveP(p);
  graded = true;
  applyGrade(result, false);
  $("checkBtn").classList.add("hidden");
  $("nextBtn").classList.remove("hidden");
  drawScore();
}

function labelOf(idxs){
  return idxs.map(k => tokens[k] ? tokens[k].textContent.replace(/^\W+|\W+$/g, "") : "")
             .filter(Boolean).join(" ");
}
const TYPE_WORD = { C: "common", P: "proper" };
function applyGrade(result, restoring){
  $("gradeNote").innerHTML = "";
  if(!result.v){   // legacy records from the first version
    (result.wrong || []).forEach(k => tokens[k] && tokens[k].classList.add("wrong"));
    (result.missed || []).forEach(k => tokens[k] && tokens[k].classList.add("missed"));
    $("verdict").textContent = result.correct ? "Correct!" : "Not quite.";
    $("verdict").className = "verdict " + (result.correct ? "ok" : "bad");
    return;
  }
  result.notNoun.forEach(idxs => idxs.forEach(k => tokens[k] && tokens[k].classList.add("struckw")));
  [...result.missed, ...result.wrongType].forEach(m => m.i.forEach(k => {
    if(!tokens[k]) return;
    tokens[k].classList.remove("struckw");
    tokens[k].dataset.s = 0;                 // wrong-type: kid's underline removed
    tokens[k].classList.add(m.t === "C" ? "missed1" : "missed2");
  }));
  $("verdict").textContent = result.correct ? "Correct!" : "Not quite.";
  $("verdict").className = "verdict " + (result.correct ? "ok" : "bad");
  if(!result.correct){
    const parts = [];
    if(result.missed.length)
      parts.push("<b>Missed:</b> " + result.missed.map(m => `${labelOf(m.i)} (${TYPE_WORD[m.t]})`).join(", "));
    if(result.wrongType.length)
      parts.push("<b>Wrong type:</b> " + result.wrongType.map(m => `${labelOf(m.i)} (${TYPE_WORD[m.t]})`).join(", "));
    if(result.notNoun.length)
      parts.push("<b>Not a noun:</b> " + result.notNoun.map(labelOf).join(", "));
    $("gradeNote").innerHTML = parts.join(" · ");
  }
}

function showFinal(){
  const s = score();
  $("quiz").classList.add("hidden"); $("final").classList.remove("hidden");
  $("finalScore").textContent = `${s.correct} / ${DATA.sentences.length}`;
  const pct = Math.round(s.correct / DATA.sentences.length * 100);
  $("finalNote").textContent = pct === 100 ? "Perfect score. Incredible."
    : `That's ${pct}%. Sentences you got wrong showed the answers as you went.`;
}

$("sentence").addEventListener("click", e => {
  if(graded) return;                     // marks lock after Check
  const sp = e.target.closest(".w"); if(!sp) return;
  sp.dataset.s = (+sp.dataset.s + 1) % 3;
  const p = loadP();
  p.states[DATA.sentences[cur].n] = tokens.map(x => +x.dataset.s);
  saveP(p);
});
$("checkBtn").onclick = grade;
$("nextBtn").onclick = () => {
  if(cur + 1 < DATA.sentences.length){ cur++; renderSentence(); window.scrollTo(0, 0); }
  else showFinal();
};
$("restartBtn").onclick = () => {
  const b = $("restartBtn");
  if(b.textContent !== "Really start over?"){ b.textContent = "Really start over?"; return; }
  localStorage.removeItem(PKEY);
  b.textContent = "Start over";
  $("final").classList.add("hidden"); $("quiz").classList.remove("hidden");
  cur = 0; renderSentence();
};

fetch("nouns-data.json").then(r => r.json()).then(d => {
  DATA = d;
  const p = loadP();
  // resume at the first ungraded sentence
  cur = DATA.sentences.findIndex(s => !p.results[s.n]);
  if(cur === -1){ cur = DATA.sentences.length - 1; renderSentence(); showFinal(); }
  else renderSentence();
});
</script>
</body>
</html>
